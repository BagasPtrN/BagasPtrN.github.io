name: Deploy server ke Hugging Face Space

on:
  push:
    branches: [main]
    paths: ["hf-space/**", ".github/workflows/hf-space.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "huggingface_hub<1.0"
      - name: Buat / perbarui Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_NAME: batak-toba-asr
        run: |
          python - <<'PY'
          import os, sys
          from huggingface_hub import HfApi
          tok = os.environ.get("HF_TOKEN")
          if not tok:
              sys.exit("Secret HF_TOKEN belum diisi: Settings > Secrets and variables > Actions")
          api = HfApi(token=tok)
          user = api.whoami()["name"]
          repo = f"{user}/{os.environ['SPACE_NAME']}"
          api.create_repo(repo, repo_type="space", space_sdk="gradio", exist_ok=True)
          api.upload_folder(folder_path="hf-space", repo_id=repo, repo_type="space",
                            commit_message="Update dari GitHub")
          print(f"Space: https://huggingface.co/spaces/{repo}")
          print(f"Halaman caption: https://bagasptrn.github.io/batak-caption/?space={repo}")
          PY
